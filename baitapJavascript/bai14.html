<!DOCTYPE html>
<html>
<head>
    <title>Tính chỉ số BMI</title>
</head>
<body>
    <h2>Tính chỉ số BMI</h2>

    <input type="number" id="chieucao" placeholder="Nhập chiều cao (m)">
    <br><br>

    <input type="number" id="cannang" placeholder="Nhập cân nặng (kg)">
    <br><br>

    <button onclick="tinhBMI()">Tính BMI</button>

    <p id="ketqua"></p>

    <script>
        function tinhBMI() {
            let cao = document.getElementById("chieucao").value;
            let nang = document.getElementById("cannang").value;

            if (cao == "" || nang == "" || cao <= 0 || nang <= 0) {
                document.getElementById("ketqua").innerHTML = "Vui lòng nhập dữ liệu hợp lệ!";
                return;
            }

            let bmi = Number(nang) / (Number(cao) * Number(cao));
            let xeploai;

            if (bmi < 18.5) {
                xeploai = "Gầy";
            } else if (bmi < 25) {
                xeploai = "Bình thường";
            } else if (bmi < 30) {
                xeploai = "Thừa cân";
            } else {
                xeploai = "Béo phì";
            }

            document.getElementById("ketqua").innerHTML =
                "Chỉ số BMI: " + bmi.toFixed(2) +
                "<br>Xếp loại: " + xeploai;
        }
    </script>
</body>
</html>
