<!DOCTYPE html>
<html>
<head>
    <title>Kiểm tra mật khẩu</title>
</head>
<body>
    <h2>Kiểm tra mật khẩu</h2>

    <input type="password" id="matkhau" placeholder="Nhập mật khẩu">
    <br><br>

    <button onclick="kiemTra()">Kiểm tra</button>

    <p id="ketqua"></p>

    <script>
        function kiemTra() {
            let matkhau = document.getElementById("matkhau").value;

            if (matkhau.length >= 8) {
                document.getElementById("ketqua").innerHTML = "Mật khẩu hợp lệ";
            } else {
                document.getElementById("ketqua").innerHTML = "Mật khẩu quá ngắn";
            }
        }
    </script>
</body>
</html>
